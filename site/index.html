<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Momentum-varsling</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-192.png">
<meta name="theme-color" content="#0f6e56">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#f7f7f5; --kort:#fff; --tekst:#1c1c1a; --dempet:#6b6b66; --linje:#e4e4df; --aksent:#0f6e56; --pos:#0f6e56; --neg:#b3261e; --gul:#8a6100; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --kort:#1f1f1c; --tekst:#ecece8; --dempet:#9a9a93; --linje:#33332f; --aksent:#5dcaa5; --pos:#5dcaa5; --neg:#f09595; --gul:#e0b44c; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--tekst); }
  header { padding:20px 20px 0; max-width:1100px; margin:0 auto; }
  h1 { font-size:20px; margin:0; font-weight:600; }
  .under { color:var(--dempet); font-size:13px; margin-top:2px; }
  nav { display:flex; gap:4px; max-width:1100px; margin:16px auto 0; padding:0 20px; border-bottom:1px solid var(--linje); overflow-x:auto; }
  nav button { background:none; border:0; border-bottom:2px solid transparent; padding:8px 12px; font:inherit; color:var(--dempet); cursor:pointer; white-space:nowrap; }
  nav button[aria-selected=true] { color:var(--tekst); border-bottom-color:var(--aksent); font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  section[hidden] { display:none; }
  .kpier { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px; }
  .kpi { background:var(--kort); border:1px solid var(--linje); border-radius:10px; padding:12px 14px; }
  .kpi .v { font-size:24px; font-weight:600; }
  .kpi .e { font-size:12px; color:var(--dempet); }
  h2 { font-size:15px; margin:22px 0 8px; }
  .tabellramme { background:var(--kort); border:1px solid var(--linje); border-radius:10px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--linje); vertical-align:top; }
  th { color:var(--dempet); font-weight:500; font-size:12px; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  td.t, th.t { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pos { color:var(--pos); } .neg { color:var(--neg); } .dempet { color:var(--dempet); }
  .merke { display:inline-block; font-size:11.5px; padding:1px 7px; border-radius:99px; border:1px solid var(--linje); color:var(--dempet); }
  .merke.kjop { color:var(--pos); border-color:var(--pos); } .merke.salg { color:var(--neg); border-color:var(--neg); }
  .filter { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  input, select { font:inherit; padding:6px 10px; border:1px solid var(--linje); border-radius:8px; background:var(--kort); color:var(--tekst); }
  .notat { font-size:13px; color:var(--dempet); background:var(--kort); border:1px solid var(--linje); border-left:3px solid var(--gul); border-radius:8px; padding:10px 14px; margin-bottom:16px; }
  a { color:var(--aksent); text-decoration:none; } a:hover { text-decoration:underline; }
  .tom { padding:24px; text-align:center; color:var(--dempet); }
  .topp { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  button.knapp { font:inherit; font-size:13px; padding:6px 12px; border-radius:8px; border:1px solid var(--linje); background:var(--kort); color:var(--tekst); cursor:pointer; }
  button.knapp:hover { border-color:var(--aksent); }
  .forslag { background:var(--kort); border:1px solid var(--linje); border-left:3px solid var(--aksent); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .forslag.svak { border-left-color:var(--linje); }
  .forslag h3 { margin:0 0 4px; font-size:15px; }
  .rad { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13.5px; }
  .rad b { font-weight:600; }
  svg.graf { width:100%; height:180px; display:block; }
  svg.graf text { font-size:11px; fill:var(--dempet); }
  textarea { width:100%; min-height:110px; font:12px ui-monospace,monospace; background:var(--bg); color:var(--tekst); border:1px solid var(--linje); border-radius:8px; padding:8px; }
  /* Kandidater */
  .verktoy { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 0 14px; }
  .chipvalg button { font:inherit; font-size:13px; padding:5px 11px; border-radius:99px; border:1px solid var(--linje); background:var(--kort); color:var(--dempet); cursor:pointer; }
  .chipvalg button[aria-pressed=true] { background:var(--aksent); border-color:var(--aksent); color:#fff; }
  .kand { background:var(--kort); border:1px solid var(--linje); border-radius:12px; padding:14px 16px; margin-bottom:12px; display:grid; grid-template-columns: 200px 1fr 1fr 270px; gap:16px; align-items:start; }
  .kand.sen { opacity:.6; }
  @media (max-width: 980px) { .kand { grid-template-columns: 1fr 1fr; } .kand .hode { grid-column: 1 / -1; } .kand .plan { grid-column: 1 / -1; } }
  @media (max-width: 560px) { .kand { grid-template-columns: 1fr; } }
  .hode { display:flex; gap:12px; align-items:flex-start; }
  .ring { flex:none; width:58px; height:58px; position:relative; }
  .ring svg { width:58px; height:58px; transform: rotate(-90deg); }
  .ring span { position:absolute; inset:0; display:grid; place-items:center; font-weight:700; font-size:17px; }
  .navn { font-weight:650; font-size:15.5px; line-height:1.25; }
  .tick { color:var(--dempet); font-size:12.5px; }
  .merk { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:99px; margin:6px 6px 0 0; border:1px solid currentColor; }
  .m-kjøp { color:var(--pos); background:color-mix(in srgb, var(--pos) 12%, transparent); }
  .m-følg { color:var(--gul); } .m-nøytral { color:var(--dempet); } .m-unngå { color:var(--neg); }
  .stat { font-size:12px; color:var(--dempet); margin-top:4px; }
  .hor { border:1px solid var(--linje); border-radius:10px; padding:10px 12px; }
  .hor .tittel { font-size:12px; color:var(--dempet); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .hor .stor { font-size:22px; font-weight:650; font-variant-numeric:tabular-nums; }
  .hor .smaa { font-size:12.5px; color:var(--dempet); font-variant-numeric:tabular-nums; }
  .bar { height:6px; background:var(--linje); border-radius:99px; overflow:hidden; margin:6px 0 2px; }
  .bar i { display:block; height:100%; background:var(--aksent); border-radius:99px; }
  .plan dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:0; font-size:13px; }
  .plan dt { color:var(--dempet); white-space:nowrap; } .plan dd { margin:0; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:550; }
  .parametre { grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap:6px; }
  .param { font-size:12px; padding:2px 9px; border-radius:6px; background:var(--bg); border:1px solid var(--linje); }
  .param b { font-weight:600; }
  .param.pos { border-color:var(--pos); } .param.neg { border-color:var(--neg); }
  details.hvorfor { grid-column: 1 / -1; font-size:13px; }
  details.hvorfor summary { cursor:pointer; color:var(--aksent); }
  .bidrag { display:grid; grid-template-columns: minmax(140px, 260px) 1fr 70px; gap:4px 10px; align-items:center; margin-top:8px; }
  .bidrag .s { height:8px; position:relative; background:var(--linje); border-radius:99px; }
  .bidrag .s i { position:absolute; top:0; bottom:0; border-radius:99px; }
  details.forklaring { background:var(--kort); border:1px solid var(--linje); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13.5px; }
  details.forklaring summary { cursor:pointer; font-weight:600; }
  details.forklaring li { margin:4px 0; }
  .sim-skjema { display:grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap:8px; align-items:end; background:var(--kort); border:1px solid var(--linje); border-radius:10px; padding:12px 14px; }
  .sim-skjema label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--dempet); }
  .sim-skjema input, .sim-skjema select { width:100%; }
  @media (max-width: 860px) { .sim-skjema { grid-template-columns: 1fr 1fr; } .sim-skjema .bred { grid-column: 1 / -1; } }
  .pos-kort { background:var(--kort); border:1px solid var(--linje); border-radius:10px; padding:12px 14px; margin-bottom:10px; display:grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr auto; gap:12px; align-items:center; }
  @media (max-width: 860px) { .pos-kort { grid-template-columns: 1fr 1fr; } }
  .pos-kort .stor { font-size:20px; font-weight:650; font-variant-numeric:tabular-nums; }
  .pos-kort .smaa { font-size:12.5px; color:var(--dempet); font-variant-numeric:tabular-nums; }
  .skala { position:relative; height:8px; background:var(--linje); border-radius:99px; margin:8px 0 4px; }
  .skala i { position:absolute; top:-3px; width:3px; height:14px; border-radius:2px; }
  .knapp.liten { font-size:12px; padding:3px 9px; }
  /* Aksjescore */
  .tidelgraf { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; align-items:end; height:90px; margin:8px 0 2px; }
  .tidelgraf div { border-radius:4px 4px 0 0; min-height:2px; }
  .tidelakse { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; font-size:11px; color:var(--dempet); text-align:center; }
  .faktor { font-size:12px; white-space:nowrap; }
  .faktor b { font-weight:600; }
  tr.mine td:first-child { box-shadow: inset 3px 0 0 var(--aksent); }
  .varselboks { background:var(--kort); border:1px solid var(--linje); border-radius:10px; padding:12px 14px; margin-top:10px; }
</style>
</head>
<body>
<header>
  <div class="topp">
    <div>
      <h1>Momentum-varsling</h1>
      <div class="under" id="generert">Laster …</div>
    </div>
    <button class="knapp" id="varselknapp" hidden title="Slå på varsler på denne enheten">🔔 Varsler</button>
  </div>
  <div id="varselpanel" hidden></div>
</header>
<nav role="tablist" id="faner"></nav>
<main>
  <section id="kandidater" hidden></section>
  <section id="aksjescore" hidden></section>
  <section id="simulering" hidden></section>
  <section id="oversikt" hidden></section>
  <section id="hjerne" hidden></section>
  <section id="handler" hidden></section>
  <section id="backtest" hidden></section>
  <section id="nyheter" hidden></section>
  <section id="drift" hidden></section>
</main>

<script>
"use strict";
const FANER = [["kandidater","Kandidater"],["aksjescore","Aksjescore"],["simulering","Simulering"],["oversikt","Oversikt"],["hjerne","Hjerne"],["handler","Innsidehandler"],["backtest","Backtest"],["nyheter","Nyheter"],["drift","Drift"]];
const ROLLER = {ceo:"CEO",cfo:"CFO",styreleder:"Styreleder",styremedlem:"Styremedlem",ledelse:"Ledelse",naerstaaende:"Nærstående",ukjent:"Ukjent"};
const RETNING = {kjop:"Kjøp",salg:"Salg",tildeling:"Tildeling",annet:"Annet"};
let D = null;

// Alt som kommer fra data.json settes via textContent — aldri innerHTML med data.
function el(tag, attrs, ...barn) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  for (const b of barn) if (b != null) e.append(b);
  return e;
}
const fmt = (n, d = 0) => n == null ? "–" : Number(n).toLocaleString("nb-NO", {maximumFractionDigits: d});
const pst = (v, d = 1) => v == null ? "–" : (v * 100).toLocaleString("nb-NO", {maximumFractionDigits: d, minimumFractionDigits: d, signDisplay: "exceptZero"}) + " %";
const kr = (v) => v == null ? "–" : Number(v).toLocaleString("nb-NO", {maximumFractionDigits: 2, minimumFractionDigits: 2});
const dato = (s) => s ? s.slice(0, 10) : "–";
const klasse = (v) => v == null ? "" : v > 0 ? "pos" : v < 0 ? "neg" : "";

function tabell(kolonner, rader, tom) {
  if (!rader.length) return el("div", {class: "tabellramme"}, el("div", {class: "tom", text: tom || "Ingen data ennå."}));
  const thead = el("thead", {}, el("tr", {}, ...kolonner.map(k => el("th", {class: k.t ? "t" : "", text: k.navn}))));
  const tbody = el("tbody", {}, ...rader.map(r => el("tr", {}, ...kolonner.map(k => {
    const v = k.vis(r);
    return v instanceof Node ? el("td", {class: k.t ? "t" : ""}, v) : el("td", {class: (k.t ? "t " : "") + (k.kl ? k.kl(r) : ""), text: v});
  }))));
  return el("div", {class: "tabellramme"}, el("table", {}, thead, tbody));
}
const kpi = (v, e) => el("div", {class: "kpi"}, el("div", {class: "v", text: v}), el("div", {class: "e", text: e}));
const merke = (retning) => el("span", {class: "merke " + retning, text: RETNING[retning] || retning});

function forslagKort(f) {
  const ticker = (f.yahoo || "").split(".")[0];
  const grunner = (f.bidrag || []).slice(0, 3).map(b => `${b[0]} ${pst(b[1])}`).join(" · ");
  return el("div", {class: "forslag" + (f.anbefalt ? "" : " svak")},
    el("h3", {text: `${f.anbefalt ? "Kjøpsforslag" : "Vurdert, ikke anbefalt"}: ${f.navn} (${ticker})`}),
    el("div", {class: "rad"},
      el("span", {}, "Inngang ", el("b", {text: `åpning ${f.inn_dato}`}), `, maks ${kr(f.limit_pris)}`),
      el("span", {}, "Stopp ", el("b", {text: kr(f.stopp)})),
      el("span", {}, "Utgang ", el("b", {text: `sluttkurs ${f.ut_dato}`})),
      el("span", {}, "Forventet ", el("b", {text: pst(f.pred), class: klasse(f.pred)}), ` (sikkerhet ${Math.round(f.sikkerhet * 100)} %)`)),
    el("div", {class: "under", text: f.beskrivelse}),
    el("div", {class: "under", text: "Hvorfor: " + grunner}));
}

function oversikt() {
  const t = D.tall, s = document.getElementById("oversikt"), H = D.hjerne || {}, st = H.status;
  s.replaceChildren();
  const advarsler = [];
  if (t.venter_pa_llm > 0) advarsler.push(`${fmt(t.venter_pa_llm)} innsidemeldinger venter på LLM-uttrekk.`);
  if (D.umappede && D.umappede.length) advarsler.push(`${D.umappede.length} selskaper med innsidekjøp mangler ticker (se Drift).`);
  const timer = D.siste_poll ? (Date.now() - new Date(D.siste_poll)) / 36e5 : null;
  if (timer == null || timer > 30) advarsler.push(timer == null ? "Nyhetspollingen har ikke logget en vellykket kjøring." : `Siste nyhetspoll var for ${Math.round(timer)} timer siden.`);
  for (const a of advarsler) s.append(el("div", {class: "notat", text: a}));

  const tr = st ? st.trades : {};
  s.append(el("div", {class: "kpier"},
    kpi(st ? kr(st.egenkapital_slutt).replace(/,\d\d$/, "") + " kr" : "–", `papirporteføljen (start ${st ? fmt(st.param.kapital) : "–"} kr)`),
    kpi(tr.lukket != null ? `${fmt(tr.lukket)} / ${fmt(tr.apne)}` : "–", "papirhandler lukket / åpne"),
    kpi(tr.treff != null ? Math.round(tr.treff * 100) + " %" : "–", "treffrate (lukkede)"),
    kpi(st && st.kalibrering.rangkorrelasjon != null ? st.kalibrering.rangkorrelasjon.toLocaleString("nb-NO") : "–", "rangkorrelasjon forventet/faktisk"),
    kpi(fmt(t.innsidekjop), "innsidekjøp (aksjer)")));

  const aktive = (H.forslag || []).filter(f => f.inn_dato >= new Date().toISOString().slice(0, 10));
  s.append(el("h2", {text: "Forslag for neste handelsdag"}));
  if (!aktive.length) s.append(el("div", {class: "tabellramme"}, el("div", {class: "tom", text: "Ingen nye hendelser venter på inngang."})));
  for (const f of aktive.sort((a, b) => b.anbefalt - a.anbefalt || b.pred - a.pred)) s.append(forslagKort(f));

  s.append(el("h2", {text: `Siste innsidesignaler (regelbasert score ≥ ${D.signal.terskel})`}));
  s.append(tabell([
    {navn: "Publisert", vis: r => dato(r.publisert)},
    {navn: "Selskap", vis: r => r.selskap},
    {navn: "Score", t: 1, vis: r => fmt(r.score, 1)},
    {navn: "Kjøpere", t: 1, vis: r => fmt(r.antall_personer)},
    {navn: "Verdi (NOK)", t: 1, vis: r => fmt(r.verdi_nok)},
  ], D.signaler.slice(0, 15), "Ingen signaler ennå."));
  s.append(el("p", {class: "under", text: "Alt her er papirhandel og læring, ikke kjøpsråd."}));
}

const EGENSKAP_NAVN = {
  "innside.rolle": "Rolle", "innside.kjøpere30d": "Kjøpere 30 d", "innside.verdi": "Kjøpt for", "innside.andel": "Andel av beholdning",
  "kurs.likviditet": "Likviditet", "kurs.momentum20": "Kurs siste 20 d", "kurs.marked": "Børs",
  "kurs.trend6m": "Trend 6 mnd", "kurs.uke52": "52 uker", "kurs.reaksjon": "Reaksjon meldingsdagen",
  "kurs.volum": "Volum meldingsdagen", "kurs.regime": "Markedet",
  "innside.mønster": "Kjøpsmønster", "innside.historikk": "Personens historikk",
  "innside.kurs_vs_innsider": "Kurs mot innsiders pris", "innside.flyt90": "Innsideflyt 90 d",
  "kurs.volatilitet": "Volatilitet", "kurs.relstyrke20": "Mot børsen 20 d", "kurs.størrelse": "Børsverdi",
  "kurs.short": "Short", "selskap.sektor": "Sektor", "kontekst.rapport": "Rapportvindu",
  "kontekst.tilbakekjøp90": "Tilbakekjøp 90 d", "kontekst.emisjon90": "Emisjon 90 d",
  "nyhet.kategori": "Kategori", "nyhet.retning": "Retning", "nyhet.overraskelse": "Overraskelse", "kilde": "Kilde",
};
const MERK = {"kjøp": ["Kjøp", "m-kjøp"], "følg med": ["Følg med", "m-følg"], "nøytral": ["Nøytral", "m-nøytral"], "unngå": ["Unngå", "m-unngå"]};
const datoKort = (s) => s ? new Date(s + "T12:00:00").toLocaleDateString("nb-NO", {day: "numeric", month: "short"}) : "–";

function scoreRing(score) {
  const NS = "http://www.w3.org/2000/svg", r = 25, o = 2 * Math.PI * r;
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 58 58"); svg.setAttribute("aria-hidden", "true");
  const sirkel = (farge, strek) => { const c = document.createElementNS(NS, "circle");
    for (const [k, v] of Object.entries({cx: 29, cy: 29, r, fill: "none", stroke: farge, "stroke-width": 6, "stroke-linecap": "round", "stroke-dasharray": `${strek} ${o}`})) c.setAttribute(k, v); return c; };
  const farge = score >= 70 ? "var(--pos)" : score >= 40 ? "var(--gul)" : "var(--neg)";
  svg.append(sirkel("var(--linje)", o), sirkel(farge, o * score / 100));
  return el("div", {class: "ring", title: `Score ${score} av 100`}, svg, el("span", {text: String(score)}));
}

function horisontBoks(navn, h, posisjon) {
  const p = Math.round(h.p_gevinst * 100);
  return el("div", {class: "hor"},
    el("div", {class: "tittel", text: `${navn} · ${h.dager} handelsdager`}),
    el("div", {class: "stor " + klasse(h.forventet), text: pst(h.forventet)}),
    el("div", {class: "smaa", text: `≈ ${h.gevinst_kr >= 0 ? "+" : "−"}${fmt(Math.abs(h.gevinst_kr))} kr på ${fmt(posisjon)} kr`}),
    el("div", {class: "bar", title: `Sannsynlighet for gevinst ${p} %`}, el("i", {style: `width:${p}%`})),
    el("div", {class: "smaa", text: `${p} % sannsynlighet for gevinst`}),
    el("div", {class: "smaa", text: `Forventet kurs ${kr(h.maal)} · selg ${datoKort(h.ut_dato)}`}));
}

function statusTekst(c) {
  if (c.status === "venter") return `Venter på åpning ${datoKort(c.inn_dato)}`;
  const hittil = c.hittil != null ? `, ${pst(c.hittil)} siden inngang` : "";
  if (c.status === "sen") return `Kort horisont passert (dag ${c.dag_nr})${hittil}`;
  return `Dag ${c.dag_nr} av ${c.kort.dager}${hittil}`;
}

function bidragListe(tittel, bidrag) {
  const maks = Math.max(0.005, ...bidrag.map(b => Math.abs(b[1])));
  const rader = [];
  for (const [navn, e] of bidrag) {
    const [f, v] = navn.split("=");
    const bredde = 50 * Math.abs(e) / maks;
    rader.push(el("span", {text: `${EGENSKAP_NAVN[f] || f}: ${v}`}),

function simLes() { try { return JSON.parse(localStorage.getItem(SIM.nokkel) || "[]"); } catch { return SIM.minne || []; } }
function simLagre(l) { SIM.minne = l; try { localStorage.setItem(SIM.nokkel, JSON.stringify(l)); } catch {} }

function simEvaluer(p) {
  const k = (D.kurser || {})[p.yahoo];
  const ut = {...p, status: "venter", inn: null, ut: null, ut_dato: null, siste: null, antall: null};
  if (!k) return {...ut, status: "ingen kurs"};
  ut.siste = k.close[k.close.length - 1];
  const i = k.dato.findIndex(d => d >= p.inn_dato);
  if (i < 0) return ut;
  if (k.open[i] == null || k.open[i] > p.limit) return {...ut, status: "ikke fylt", ut_dato: k.dato[i]};
  ut.inn = k.open[i]; ut.inn_faktisk_dato = k.dato[i]; ut.antall = p.belop / ut.inn; ut.status = "åpen";
  for (let j = i; j < k.dato.length; j++) {
    if (p.manuelt_ut && k.dato[j] >= p.manuelt_ut) { ut.status = "solgt"; ut.ut = k.close[j]; ut.ut_dato = k.dato[j]; break; }
    if (k.low[j] != null && k.low[j] <= p.stopp) { ut.status = "stoppet"; ut.ut = Math.min(k.open[j] || p.stopp, p.stopp); ut.ut_dato = k.dato[j]; break; }
    if (k.dato[j] >= p.ut_dato) { ut.status = "solgt"; ut.ut = k.close[j]; ut.ut_dato = k.dato[j]; break; }
  }
  const pris = ut.status === "åpen" ? ut.siste : ut.ut;
  ut.brutto_kr = ut.antall * (pris - ut.inn);
  ut.kost_kr = p.belop * p.kostnad;
  ut.netto_kr = ut.brutto_kr - ut.kost_kr;
  ut.netto = ut.netto_kr / p.belop;
  const idx = (D.kurser || {})[{OL: "OSEBX.OL", ST: "^OMXSPI", HE: "^OMXH25", CO: "^OMXC25"}[p.bors]];
  if (idx) {
    const a = idx.dato.findIndex(d => d >= ut.inn_faktisk_dato), slutt = ut.status === "åpen" ? idx.dato.length - 1 : idx.dato.findIndex(d => d >= ut.ut_dato);
    if (a >= 0 && slutt >= a) ut.marked = idx.close[slutt] / (idx.open[a] || idx.close[a]) - 1;
  }
  return ut;
}

function skala(p) {
  // Stopp — inngang — break-even — forventet kurs, med siste kurs som markør.
  const verdier = [p.stopp, p.inn || p.limit, p.limit * (1 + p.kostnad), p.maal, p.status === "åpen" ? p.siste : p.ut].filter(v => v);
  const lo = Math.min(...verdier) * 0.995, hi = Math.max(...verdier) * 1.005, x = v => `${100 * (v - lo) / (hi - lo)}%`;
  const merke = (v, farge, tittel) => v ? el("i", {style: `left:${x(v)};background:${farge}`, title: tittel}) : null;
  return el("div", {class: "skala", title: "Rød = stopp, grå = inngang, gul = break-even, grønn = forventet kurs, svart = nå"},
    merke(p.stopp, "var(--neg)", "Stopp"), merke(p.inn || p.limit, "var(--dempet)", "Inngang"),
    merke(p.limit * (1 + p.kostnad), "var(--gul)", "Break-even"), merke(p.maal, "var(--pos)", "Forventet kurs"),
    merke(p.status === "åpen" ? p.siste : p.ut, "var(--tekst)", "Nå / salg"));
}

function simuleringFane() {
  const s = document.getElementById("simulering"), H = D.hjerne || {}, st = H.status;
  s.replaceChildren();

  // 1) Din papirportefølje
  s.append(el("h2", {text: "Din papirportefølje"}));
  s.append(el("p", {class: "under", text: "Lagres bare i denne nettleseren. Følges mot ekte dagskurser: kjøp på åpning (ikke fylt over limit), stopp når dagens laveste går under, salg på sluttkurs på salgsdagen. Kurtasje og slippage er trukket fra."}));
  const kand = (st && st.kandidater) || [];
  if (kand.length) {
    const velg = el("select", {}, ...kand.map(c => el("option", {value: c.nokkel, text: `${c.rang}. ${c.navn} (${c.ticker}) · score ${c.score}`})));
    if (SIM.forhaandsvalg) velg.value = SIM.forhaandsvalg;
    const belop = el("input", {type: "number", min: "100", step: "100", value: String(Math.round(st.param.posisjon))});
    const hor = el("select", {}, el("option", {value: "kort", text: "Kort sikt"}), el("option", {value: "lang", text: "Lang sikt"}));
    const limit = el("input", {type: "number", step: "0.01"}), stopp = el("input", {type: "number", step: "0.01"});
    const fyll = () => { const c = kand.find(x => x.nokkel === velg.value); if (!c) return;
      limit.value = c.limit.toFixed(2); stopp.value = c.stopp.toFixed(2);
      hor.value = c.kjop_horisont === "lang" ? "lang" : "kort"; belop.value = String(Math.round(c.posisjon)); };
    velg.addEventListener("input", fyll); fyll();
    const leggTil = el("button", {class: "knapp", text: "Kjøp på papiret"});
    leggTil.addEventListener("click", () => {
      const c = kand.find(x => x.nokkel === velg.value); if (!c) return;
      const h = c[hor.value];
      const liste = simLes();
      liste.push({id: Date.now(), nokkel: c.nokkel, navn: c.navn, ticker: c.ticker, yahoo: c.yahoo, bors: c.bors,
        inn_dato: c.inn_dato, limit: +limit.value, stopp: +stopp.value, belop: Math.max(100, +belop.value),
        horisont: hor.value, ut_dato: h.ut_dato, maal: c.limit > 0 ? (+limit.value) * (h.maal / c.limit) : h.maal,
        forventet: h.forventet, kostnad: c.kostnad, opprettet: new Date().toISOString().slice(0, 10)});
      simLagre(liste); SIM.forhaandsvalg = null; simuleringFane();
    });
    s.append(el("div", {class: "sim-skjema"},
      el("label", {class: "bred"}, "Kandidat", velg), el("label", {}, "Beløp (kr)", belop), el("label", {}, "Horisont", hor),
      el("label", {}, "Maks inngang", limit), el("label", {}, "Stopp", stopp), leggTil));
  }

  const mine = simLes().map(simEvaluer);
  const fylt = mine.filter(p => p.inn != null);
  const sum = (f) => fylt.reduce((a, p) => a + (f(p) || 0), 0);
  const investert = sum(p => p.belop), netto = sum(p => p.netto_kr);
  s.append(el("div", {class: "kpier", style: "margin-top:12px"},
    kpi(`${netto >= 0 ? "+" : "−"}${fmt(Math.abs(netto))} kr`, "resultat etter kostnader"),
    kpi(investert ? pst(netto / investert) : "–", `på ${fmt(investert)} kr investert`),
    kpi(`${fylt.filter(p => p.status === "åpen").length} / ${fylt.filter(p => p.status !== "åpen").length}`, "åpne / avsluttede"),
    kpi(fylt.length ? Math.round(100 * fylt.filter(p => p.netto > 0).length / fylt.length) + " %" : "–", "i pluss")));
  if (!mine.length) s.append(el("div", {class: "tabellramme"}, el("div", {class: "tom", text: "Ingen papirkjøp ennå. Velg en kandidat over, eller trykk «Simuler kjøp» på Kandidater-fanen."})));
  for (const p of mine.slice().reverse()) {
    const slett = el("button", {class: "knapp liten", text: "Fjern"});
    slett.addEventListener("click", () => { simLagre(simLes().filter(x => x.id !== p.id)); simuleringFane(); });
    const handling = [slett];
    if (p.status === "åpen") {
      const selg = el("button", {class: "knapp liten", text: "Selg nå"});
      selg.addEventListener("click", () => { simLagre(simLes().map(x => x.id === p.id ? {...x, manuelt_ut: D.tall.siste_kurs} : x)); simuleringFane(); });
      handling.unshift(selg);
    }
    const statusTekst = {venter: `Venter på åpning ${datoKort(p.inn_dato)}`, "ikke fylt": `Ikke fylt — åpnet over ${kr(p.limit)}`, "ingen kurs": "Mangler kurs",
      åpen: `Åpen · selges ${datoKort(p.ut_dato)}`, stoppet: `Stoppet ut ${datoKort(p.ut_dato)}`, solgt: `Solgt ${datoKort(p.ut_dato)}`}[p.status] || p.status;
    s.append(el("div", {class: "pos-kort"},
      el("div", {}, el("div", {class: "navn", text: p.navn}), el("div", {class: "tick", text: `${p.ticker} · ${p.horisont} sikt · ${fmt(p.belop)} kr`}),
        el("div", {class: "stat", text: statusTekst})),
      el("div", {}, el("div", {class: "smaa", text: "Inngang → nå/salg"}),
        el("div", {text: p.inn ? `${kr(p.inn)} → ${kr(p.status === "åpen" ? p.siste : p.ut)}` : `maks ${kr(p.limit)}`})),
      el("div", {}, el("div", {class: "smaa", text: "Resultat netto"}),
        el("div", {class: "stor " + klasse(p.netto_kr), text: p.netto_kr != null ? `${p.netto_kr >= 0 ? "+" : "−"}${fmt(Math.abs(p.netto_kr))} kr` : "–"}),
        el("div", {class: "smaa", text: p.netto != null ? `${pst(p.netto)} · marked ${pst(p.marked)}` : `forventet ${pst(p.forventet)}`})),
      el("div", {}, skala(p), el("div", {class: "smaa", text: `stopp ${kr(p.stopp)} · mål ${kr(p.maal)}`})),
      el("div", {style: "display:flex;gap:6px;flex-wrap:wrap"}, ...handling)));
  }

  // 2) Hjernens papirportefølje
  s.append(el("h2", {text: "Hjernens papirportefølje"}));
  if (!st) { s.append(el("div", {class: "tom", text: "Hjernen har ikke kjørt ennå."})); return; }
  const tr = st.trades, p = st.param;
  s.append(el("p", {class: "under", text: `Start ${fmt(p.kapital)} kr. Hjernen handler selv når forventet netto meravkastning er over ${pst(p.min_edge)} og sikkerheten over ${Math.round(p.min_sikkerhet * 100)} %. Posisjon: maks ${Math.round(p.maks_andel * 100)} % av kapitalen, ca. ${Math.round(p.risiko * 100)} % risiko til stopp, maks ${Math.round(p.likviditet_tak * 100)} % av dagsomsetningen; maks ${p.maks_apne} samtidig, stopp ${p.stopp_atr} × ATR, salg etter ${p.horisont} handelsdager. Spilt av dag for dag uten å se fremtiden.`}));
  s.append(el("div", {class: "kpier"},
    kpi(fmt(st.egenkapital_slutt) + " kr", `verdi (start ${fmt(p.kapital)} kr)`),
    kpi(pst(st.egenkapital_slutt / p.kapital - 1), "avkastning totalt"),
    kpi(`${fmt(tr.lukket)} / ${fmt(tr.apne)}`, "lukket / åpne"),
    kpi(tr.treff != null ? Math.round(tr.treff * 100) + " %" : "–", "treffrate"),
    kpi(pst(tr.snitt_netto), "snitt netto per handel")));
  const ek = H.egenkapital || [], forste = (H.trades || []).map(t => t.inn_dato).sort()[0];
  const fra = forste ? Math.max(0, ek.findIndex(e => e.dato >= forste) - 5) : Math.max(0, ek.length - 60);
  s.append(graf(ek.slice(fra), p.kapital));
  s.append(el("h2", {text: "Hjernens handler"}));
  s.append(tabell([
    {navn: "Inn", vis: r => r.inn_dato},
    {navn: "Selskap", vis: r => r.navn},
    {navn: "Beløp", t: 1, vis: r => fmt(r.belop)},
    {navn: "Inngang", t: 1, vis: r => kr(r.inn)},
    {navn: "Stopp", t: 1, vis: r => kr(r.stopp)},
    {navn: "Ut", vis: r => r.status === "åpen" ? `planlagt ${r.plan_ut_dato || "–"}` : r.ut_dato},
    {navn: "Status", vis: r => r.status},
    {navn: "Netto", t: 1, vis: r => r.status === "åpen" ? pst(r.raa) + " (åpen, brutto)" : pst(r.netto), kl: r => klasse(r.status === "åpen" ? r.raa : r.netto)},
    {navn: "Kr", t: 1, vis: r => r.pnl_kr != null ? fmt(r.pnl_kr) : "–", kl: r => klasse(r.pnl_kr)},
    {navn: "Forventet", t: 1, vis: r => pst(r.pred)},
  ], H.trades || [], "Ingen papirhandler ennå — hjernen har ikke funnet noe den har tro på."));
}

function graf(punkter, startverdi) {
  const NS = "http://www.w3.org/2000/svg", B = Math.max(320, Math.min(1060, window.innerWidth - 40)), Hh = 180, P = 28;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${B} ${Hh}`); svg.setAttribute("class", "graf"); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Papirporteføljens verdi over tid");
  if (punkter.length < 2) return el("div", {class: "tom", text: "For lite historikk til graf."});
  const ys = punkter.map(p => p.verdi).concat([startverdi]);
  const lo = Math.min(...ys), hi = Math.max(...ys), sp = (hi - lo) || 1;
  const x = i => P + (B - 2 * P) * i / (punkter.length - 1), y = v => Hh - P - (Hh - 2 * P) * (v - lo) / sp;
  const lag = (t, a) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
  svg.append(lag("line", {x1: P, x2: B - P, y1: y(startverdi), y2: y(startverdi), stroke: "currentColor", "stroke-opacity": .25, "stroke-dasharray": "4 4"}));
  svg.append(lag("polyline", {points: punkter.map((p, i) => `${x(i)},${y(p.verdi)}`).join(" "), fill: "none", stroke: "var(--aksent)", "stroke-width": 2}));
  const tekst = (tx, ty, t, anker) => { const e = lag("text", {x: tx, y: ty, "text-anchor": anker || "start"}); e.textContent = t; return e; };
  svg.append(tekst(P, Hh - 8, punkter[0].dato), tekst(B - P, Hh - 8, punkter[punkter.length - 1].dato, "end"),
             tekst(B - P, 14, fmt(hi) + " kr", "end"), tekst(B - P, Math.min(Hh - P - 4, y(lo) - 6), fmt(lo) + " kr", "end"));
  return el("div", {class: "tabellramme"}, svg);
}

    `Nyere utfall veier mest (halveringstid ${p.halveringstid} dager). Den foreslår kjøp bare når forventet verdi er over ${pst(p.min_edge)} ` +
    `og sikkerheten over ${Math.round(p.min_sikkerhet * 100)} %. Posisjon ${fmt(p.posisjon)} kr, maks ${p.maks_apne} åpne.`}));

  ], k.grupper || [], "Ikke nok vurderinger med kjent utfall."));

  const eff = [];
  for (const [f, vs] of Object.entries((st.modell || {}).effekter || {})) for (const [v, e] of Object.entries(vs)) eff.push({f, v, ...e});
  eff.sort((a, b) => Math.abs(b.effekt) - Math.abs(a.effekt));
  s.append(el("h2", {text: "Det den har lært (effekt på forventet netto meravkastning)"}));
  s.append(el("p", {class: "under", text: `Basis ${pst((st.modell || {}).basis)} · ${fmt((st.modell || {}).n)} observasjoner · vekt = hvor mye data effekten hviler på.`}));
  s.append(tabell([
    {navn: "Egenskap", vis: r => r.f},
    {navn: "Verdi", vis: r => r.v},
    {navn: "Effekt", t: 1, vis: r => pst(r.effekt, 2), kl: r => klasse(r.effekt)},
    {navn: "Vekt", t: 1, vis: r => fmt(r.vekt, 1)},
  ], eff.slice(0, 30), "Ingen effekter ennå."));

  s.append(el("h2", {text: "Siste vurderinger"}));
  s.append(tabell([
    {navn: "Inn", vis: r => r.inn_dato},
    {navn: "Selskap", vis: r => r.navn},
    {navn: "Kilde", vis: r => r.kilde, kl: () => "dempet"},
    {navn: "Forventet", t: 1, vis: r => pst(r.pred), kl: r => klasse(r.pred)},
    {navn: "Sikkerhet", t: 1, vis: r => Math.round(r.sikkerhet * 100) + " %"},
    {navn: "Valgt", vis: r => r.valgt ? "ja" : ""},

}

// --- Web push: abonnementet vises her og legges inn som GitHub-secret.
function b64tilBytes(b64) {
  const p = "=".repeat((4 - b64.length % 4) % 4), r = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(r, c => c.charCodeAt(0));
}

async function slaaPaaVarsler() {
  const panel = document.getElementById("varselpanel");
  panel.hidden = false;
  const vis = (...barn) => panel.replaceChildren(el("div", {class: "varselboks"}, ...barn));
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      vis(el("p", {text: "Denne nettleseren støtter ikke web push. På iPhone: Del → «Legg til på Hjem-skjerm», åpne appen derfra og prøv igjen."}));
      return;
    }
    if (!D.webpush_public) { vis(el("p", {text: "Web push er ikke satt opp: repo-variabelen WEBPUSH_VAPID_PUBLIC mangler (se README)."})); return; }
    const tillatelse = await Notification.requestPermission();
    if (tillatelse !== "granted") { vis(el("p", {text: "Varsler ble ikke tillatt. Slå det på i nettleserens innstillinger for siden."})); return; }
    const reg = await navigator.serviceWorker.ready;
    const ab = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64tilBytes(D.webpush_public)});
    const json = JSON.stringify(ab.toJSON());
    const felt = el("textarea", {readonly: "readonly"}); felt.value = json;
    const kopier = el("button", {class: "knapp", text: "Kopier"});
    kopier.addEventListener("click", async () => { try { await navigator.clipboard.writeText(json); kopier.textContent = "Kopiert ✓"; } catch { felt.select(); } });
    vis(el("p", {text: "Varsler er tillatt på denne enheten. Siste steg: legg teksten under inn som GitHub-secret WEBPUSH_SUBSCRIPTIONS (flere enheter: lim dem inn som en liste [ {...}, {...} ]). Kjør så «Varslingstest»."}),
        felt, el("div", {}, kopier));
  } catch (e) {
    vis(el("p", {text: "Klarte ikke å slå på varsler: " + e.message}));
  }
}

function visFane(id) {
  for (const [k] of FANER) document.getElementById(k).hidden = k !== id;
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", b.dataset.id === id);
  history.replaceState(null, "", "#" + id);
}

async function start() {
  const nav = document.getElementById("faner");
  for (const [id, navn] of FANER) {
    const b = el("button", {role: "tab", "data-id": id, text: navn});
    b.addEventListener("click", () => visFane(id));
    nav.append(b);
  }
  try {
    const r = await fetch("data.json", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
  } catch (e) {
    document.getElementById("generert").textContent = "Fant ikke data.json — kjør eksporten først.";
    return;
  }
  document.getElementById("generert").textContent = "Oppdatert " + D.generert.replace("T", " ").slice(0, 16);
  kandidaterFane(); aksjescoreFane(); simuleringFane(); oversikt(); hjerneFane(); handlerFane(); backtestFane(); nyheterFane(); driftFane();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    const knapp = document.getElementById("varselknapp");
    knapp.hidden = false;
    knapp.addEventListener("click", slaaPaaVarsler);
  }
  const fra = location.hash.slice(1);
  visFane(FANER.some(f => f[0] === fra) ? fra : "kandidater");
}
start();
