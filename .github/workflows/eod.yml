name: Kurser og rapport

on:
  schedule:
    - cron: "30 18 * * 1-5"   # 20:30 norsk tid, godt etter børsslutt
    - cron: "0 8 * * 6"       # lørdag: ukesrapport
  workflow_dispatch:

concurrency:
  group: momentum-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hent databasen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.db_lagring hent

      - name: Hent kurser
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.fetch_prices

      - name: Kontekst (rapporter, tilbakekjøp, emisjoner, short, sektor)
        env:
          MOMENTUM_UA: ${{ secrets.MOMENTUM_UA }}
        run: python -m src.kontekst_kjor

      - name: Hjerne (lær, simuler, foreslå, varsle)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBPUSH_VAPID_PRIVATE: ${{ secrets.WEBPUSH_VAPID_PRIVATE }}
          WEBPUSH_SUBSCRIPTIONS: ${{ secrets.WEBPUSH_SUBSCRIPTIONS }}
          WEBPUSH_KONTAKT: ${{ vars.WEBPUSH_KONTAKT }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          HJERNE_VARSLE: ${{ vars.HJERNE_VARSLE || '1' }}
        run: python -m src.hjerne_kjor

      - name: Ukesrapport
        if: github.event.schedule == '0 8 * * 6' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.report

      - name: Lagre databasen (release «data-siste»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.db_lagring last-opp
