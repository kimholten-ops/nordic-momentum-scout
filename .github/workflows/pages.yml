name: Dashboard (GitHub Pages)

# Bygger site/data.json fra databasen og publiserer site/ til GitHub Pages.
# Kjører etter hver dataoppdatering. Krever: Settings -> Pages -> Source =
# "GitHub Actions".
on:
  workflow_run:
    workflows: ["Poll nyheter", "Kurser og rapport", "Innside backfill og backtest", "Innside arkiv (MFN, uten KI)", "Importer Ollama-tolkninger", "Kontekst arkiv (engangs)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  # Bygg og last opp i én jobb, publiser i en egen (anbefalt av actions/deploy-pages).
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hent databasen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.db_lagring hent
      - name: Eksporter data
        env:
          WEBPUSH_VAPID_PUBLIC: ${{ vars.WEBPUSH_VAPID_PUBLIC }}
        run: python -m src.eksport_dashboard
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
