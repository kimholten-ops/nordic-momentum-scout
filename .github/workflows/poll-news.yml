name: Poll nyheter

on:
  schedule:
    # Hvert 10. minutt, 06:50-15:10 UTC = ca. 08:50-17:10 norsk sommertid.
    # Vinterstid forskyves alt en time; det er greit i fase 0.
    - cron: "*/10 6-15 * * 1-5"
  workflow_dispatch:

# Én kjøring om gangen. Uten dette kolliderer to jobber i push til data/.
concurrency:
  group: momentum-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hent nyheter
        env:
          MOMENTUM_UA: ${{ secrets.MOMENTUM_UA }}
          MFN_FEED_URL: ${{ vars.MFN_FEED_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.poll_news

      - name: Dedupliser og klassifiser
        env:
          MOMENTUM_UA: ${{ secrets.MOMENTUM_UA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KLASSIFISERING_MAKS_KALL: ${{ vars.KLASSIFISERING_MAKS_KALL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.klassifiser

      - name: Commit databasen
        run: |
          git config user.name "momentum-bot"
          git config user.email "actions@github.com"
          git add data/momentum.db
          git diff --staged --quiet && echo "ingen endring" && exit 0
          git commit -m "data: nyheter $(date -u +'%Y-%m-%d %H:%M')"
          # Rebase mot origin i tilfelle en annen jobb rakk å pushe.
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && exit 0
            sleep 5
          done
          exit 1
