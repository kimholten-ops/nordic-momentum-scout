name: Poll nyheter

on:
  schedule:
    # Hvert 10. minutt, 06:50-15:10 UTC = ca. 08:50-17:10 norsk sommertid.
    # Vinterstid forskyves alt en time; det er greit i fase 0.
    - cron: "*/10 6-15 * * 1-5"
  workflow_dispatch:

# Én kjøring om gangen. Uten dette kolliderer to jobber i push til data/.
concurrency:
  group: momentum-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hent databasen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.db_lagring hent

      - name: Hent nyheter
        env:
          MOMENTUM_UA: ${{ secrets.MOMENTUM_UA }}
          MFN_FEED_URL: ${{ vars.MFN_FEED_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.poll_news

      - name: Dedupliser og klassifiser
        env:
          MOMENTUM_UA: ${{ secrets.MOMENTUM_UA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KLASSIFISERING_MAKS_KALL: ${{ vars.KLASSIFISERING_MAKS_KALL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.klassifiser

      - name: Innsidehandel
        env:
          MOMENTUM_UA: ${{ secrets.MOMENTUM_UA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INNSIDE_VARSLE: ${{ vars.INNSIDE_VARSLE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.innside_kjor

      - name: Hjerne (lær, simuler, foreslå, varsle)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBPUSH_VAPID_PRIVATE: ${{ secrets.WEBPUSH_VAPID_PRIVATE }}
          WEBPUSH_SUBSCRIPTIONS: ${{ secrets.WEBPUSH_SUBSCRIPTIONS }}
          WEBPUSH_KONTAKT: ${{ vars.WEBPUSH_KONTAKT }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          HJERNE_VARSLE: ${{ vars.HJERNE_VARSLE || '1' }}
        run: python -m src.hjerne_kjor

      - name: Lagre databasen (release «data-siste»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.db_lagring last-opp
