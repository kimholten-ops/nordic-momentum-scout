name: Importer Ollama-tolkninger

# PC-en (scripts/ollama_tolk.py) pusher tolkninger til grenen
# «ollama-tolkninger». Denne jobben henter dem derfra annenhver time.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: momentum-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOMENTUM_UA: ${{ secrets.MOMENTUM_UA }}
      INNSIDE_LLM: "av"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hent databasen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.db_lagring hent
      - name: Importer tolkninger
        run: python -m scripts.importer_tolkninger --fra-gren
      - name: Signaler
        run: python -m src.innside_kjor --maks-llm-kall 0
      - name: Kurser for nye selskaper
        run: python -m src.fetch_prices
      - name: Hjerne (uten varsel — dette er historikk)
        run: python -m src.hjerne_kjor --ikke-varsle
      - name: Lagre databasen (release «data-siste»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.db_lagring last-opp
      - name: Commit univers
        run: |
          git config user.name "momentum-bot"
          git config user.email "actions@github.com"
          git add universe/tickers.csv
          git diff --staged --quiet && echo "ingen endring" && exit 0
          git commit -m "data: importerte ollama-tolkninger $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && exit 0
            sleep 5
          done
          exit 1
